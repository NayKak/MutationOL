<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mutation Online</title>
<style>
:root{--bg:#0d1020;--card:#171b31;--card2:#222944;--txt:#f8f9ff;--muted:#aeb6d2;--a:#8e9cff;--ok:#62e6a1;--bad:#ff7189}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#252d5b,#0d1020 48%);color:var(--txt);font-family:system-ui,-apple-system,sans-serif}
.app{width:min(680px,100%);margin:auto;padding:18px 16px 30px}h1{text-align:center;margin:6px 0 2px;font-size:32px}.sub{text-align:center;color:var(--muted);margin-bottom:18px}
.card{background:#171b31ed;border:1px solid #ffffff12;border-radius:24px;padding:20px;box-shadow:0 20px 50px #0005;margin-bottom:14px}
h2{margin:0 0 14px}.row{display:flex;gap:10px}.row>*{flex:1}
input,select{width:100%;padding:15px;border-radius:14px;border:2px solid #ffffff16;background:var(--card2);color:white;font-size:17px;outline:none;margin:6px 0}
input:focus,select:focus{border-color:var(--a)}button{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:850;background:var(--a);color:#11152a;margin-top:8px}
button.secondary{background:var(--card2);color:white}button:disabled{opacity:.45}.hidden{display:none!important}
.msg{text-align:center;color:var(--muted);min-height:24px;margin-top:10px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.code{text-align:center;font-size:40px;font-weight:950;letter-spacing:7px;margin:10px}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{background:var(--card2);padding:14px;border-radius:15px;text-align:center}.player.active{outline:2px solid var(--a)}
.timer{text-align:center;font-size:46px;font-weight:950;font-variant-numeric:tabular-nums}.danger{color:var(--bad)}.timerRow{display:flex;justify-content:center;align-items:baseline;gap:10px}.malus{font-size:20px;font-weight:900;color:var(--bad)}.gauge{height:9px;background:var(--card2);border-radius:99px;overflow:hidden;margin:0 auto 14px;max-width:360px}.gaugeFill{height:100%;background:var(--a);width:0%;transition:width .2s}.mut{color:var(--bad);font-weight:950}.mut.removed{position:relative;display:inline-block;color:#ff718980;font-weight:950;text-decoration:none}.mut.removed::before,.mut.removed::after{content:"";position:absolute;left:-1px;right:-1px;top:50%;height:1px;background:var(--bad);transform-origin:center}.mut.removed::before{transform:rotate(45deg)}.mut.removed::after{transform:rotate(-45deg)}
.word{text-align:center;font-size:clamp(38px,13vw,64px);font-weight:950;letter-spacing:2px;margin:7px 0 16px;word-break:break-word}
.history{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.pill{padding:6px 9px;background:var(--card2);border-radius:9px;font-size:12px}
.small{font-size:13px;color:var(--muted);line-height:1.45}.center{text-align:center}.status{font-size:13px;color:var(--muted);text-align:center;margin-bottom:8px}
</style>
</head>
<body><div class="app">
<h1>Mutation</h1><div class="sub">Duel de mots en ligne</div>
<div id="status" class="status">Connexion à Firebase…</div><div id="netBanner" class="msg hidden">Connexion perdue — reconnexion…</div>

<section id="home" class="card">
<h2>Jouer</h2>
<input id="nick" maxlength="18" placeholder="Ton pseudo">
<div class="row"><button id="showCreate">Créer une partie</button><button id="showJoin" class="secondary">Rejoindre</button></div>
<div id="createBox" class="hidden">
<button id="create">Créer la partie</button>
</div>
<div id="joinBox" class="hidden">
<input id="joinCode" maxlength="5" placeholder="CODE" style="text-transform:uppercase;text-align:center;letter-spacing:4px">
<button id="join">Rejoindre la partie</button>
</div>
<div id="homeMsg" class="msg"></div>
</section>

<section id="lobby" class="card hidden">
<h2 class="center">Code de la partie</h2><div id="roomCode" class="code">-----</div>
<div class="players"><div class="player"><b id="lp1">—</b><div>Joueur 1</div><div id="ready1" class="small">Pas prêt</div></div><div class="player"><b id="lp2">En attente…</b><div>Joueur 2</div><div id="ready2" class="small">Pas prêt</div></div></div><button id="readyBtn" class="secondary">Je suis prêt</button>
<p id="settings" class="center small"></p><button id="startGame" class="hidden">Lancer la partie</button>
<div id="lobbyMsg" class="msg">En attente du deuxième joueur…</div><button id="leaveLobby" class="secondary">Quitter</button>
</section>

<section id="game" class="card hidden">
<div class="players"><div id="gp1" class="player"><b id="gn1">J1</b><div id="gs1">0 🏆</div></div><div id="gp2" class="player"><b id="gn2">J2</b><div id="gs2">0 🏆</div></div></div>
<div id="turn" class="center small" style="margin-top:14px">Tour de…</div><div class="timerRow"><div id="timer" class="timer">60</div><div id="malus" class="malus"></div></div><div id="gaugeText" class="center small"></div><div class="gauge"><div id="gaugeFill" class="gaugeFill"></div></div><div id="current" class="word">CHAT</div>
<form id="form"><input id="answer" maxlength="28" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Nouveau mot"><button id="validate">VALIDER</button></form>
<div id="choiceBox" class="hidden"><p class="center"><b id="choiceTitle">Vote pour un mot de départ</b></p><div id="choices" class="row"></div><div id="voteInfo" class="msg"></div></div>
<div id="gameMsg" class="msg"></div><div id="solutions" class="history hidden" style="justify-content:center"></div><div id="history" class="history"></div>
<button id="nextRound" class="hidden secondary" style="margin-top:14px">JE SUIS PRÊT</button><div id="endActions" class="row hidden" style="margin-top:14px"><button id="replay">Rejouer</button><button id="quitGame" class="secondary">Quitter</button></div>
</section>
</div>

<script type="module">

async function restoreSession(){let c;try{c=localStorage.getItem(SESSION_KEY);let n=localStorage.getItem(NICK_KEY);if(n&&!$("nick").value)$("nick").value=n}catch{}if(!c||!uid)return;try{let s=await get(ref(db,"rooms/"+c));if(!s.exists()){clearSession();return}let d=s.val();if(d.lastActivity&&now()-d.lastActivity>=INACTIVE){try{await remove(ref(db,"rooms/"+c))}catch{}clearSession();return}let me=d.players?.p1?.uid===uid?"p1":d.players?.p2?.uid===uid?"p2":null;if(!me){clearSession();return}room=d;roomCode=c;await update(ref(db,`rooms/${c}/players/${me}`),{online:true,lastSeen:now()});subscribe(c)}catch{}}
function msg(id,t,c=""){$(id).textContent=t;$(id).className="msg "+c}function screen(id){["home","lobby","game"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}

function marked(prev,word){let a=key(prev||''),b=key(word||''),raw=(word||'').toUpperCase(),oldRaw=(prev||'').toUpperCase();if(!prev)return raw;if(a.length===b.length){let out='';for(let i=0;i<raw.length;i++)out+=a[i]!==b[i]?`<span class="mut">${raw[i]}</span>`:raw[i];return out}if(b.length===a.length+1){let i=0,j=0,out='';while(j<b.length){if(i<a.length&&a[i]===b[j]){out+=raw[j];i++;j++}else{out+=`<span class="mut">${raw[j]}</span>`;j++}}return out}if(a.length===b.length+1){let i=0,j=0,out='';while(i<a.length){if(j<b.length&&a[i]===b[j]){out+=raw[j];i++;j++}else{out+=`<span class="mut removed">${oldRaw[i]}</span>`;i++}}return out}return raw}
function timerInfo(g){let n=Math.max(0,g?.totalWords||0),steps=Math.min(9,Math.floor(n/10)),malus=steps*5,limit=Math.max(15,60-malus),toNext=limit>15?10-(n%10):0;return{n,malus,limit,toNext,progress:limit>15?(n%10)*10:100}}
function possible(w,limit=3){if(!dictReady||!w)return [];let used=new Set(hist(room?.game).map(x=>key(x.word))),a=[];for(let x of WORDS){if(!used.has(key(x))&&mutation(w,x)){a.push(WORD_FORM.get(key(x))||x);if(a.length>=limit)break}}return a}
function repl(a,b){if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i]&&++d>1)return false;return d===1}

async function dictionary(){let base=[],extra=[];try{let r=await fetch(DICT_URL,{cache:"force-cache"});if(r.ok)base=(await r.text()).split(/\r?\n/).map(norm).filter(Boolean)}catch{}try{let r=await fetch(SHEET_URL,{cache:"no-store"});if(r.ok)extra=sheetWords(await r.text())}catch{}let list=[...base,...extra];if(!list.length){$("status").textContent="Firebase OK • dictionnaire indisponible";return}buildDictionary(list);$("status").textContent=`Connecté • ${WORDS.size.toLocaleString("fr-FR")} mots${extra.length?` • +${extra.length} Sheet`:""}` }
const INACTIVE=90000;
async function cleanup(){try{let s=await get(ref(db,"rooms")),t=now(),jobs=[];s.forEach(c=>{let d=c.val()||{},p1=d.players?.p1,p2=d.players?.p2;let base=d.lastActivity||d.createdAt||0;let inactive=!!base&&t-base>=INACTIVE;let hostGone=!!p1&&p1.online===false&&p1.lastSeen&&t-p1.lastSeen>=GRACE;let orphanResidue=!d.lastActivity&&!d.createdAt&&hostGone;let orphanLobby=d.status==="lobby"&&hostGone;let abandonedGame=p2?.uid&&hostGone;if(inactive||orphanResidue||orphanLobby||abandonedGame)jobs.push(remove(c.ref))});if(jobs.length){let r=await Promise.allSettled(jobs);for(let x of r)if(x.status==="rejected")console.warn("Suppression room fantôme refusée :",x.reason?.code||x.reason)}}catch(e){console.warn("Nettoyage global des rooms impossible :",e?.code||e)}}
function activityCleanup(){if(uid)cleanup()}
setInterval(activityCleanup,15000);
["pointerdown","keydown","touchstart","focus"].forEach(ev=>window.addEventListener(ev,activityCleanup,{passive:true}));
async function pruneHostedRooms(keepCode){if(!uid||!keepCode||lastPrunedFor===keepCode)return;lastPrunedFor=keepCode;try{let s=await get(ref(db,"rooms")),jobs=[];s.forEach(c=>{let d=c.val();if(c.key!==keepCode&&d?.host===uid)jobs.push(remove(c.ref))});await Promise.allSettled(jobs)}catch{lastPrunedFor=""}}
signInAnonymously(auth).catch(e=>$("status").textContent="Erreur Firebase : "+e.code);onAuthStateChanged(auth,async u=>{if(u){uid=u.uid;dictionary();await cleanup();await restoreSession()}});
onValue(ref(db,".info/connected"),s=>{$("netBanner").classList.toggle("hidden",s.val()===true);if(s.val()&&roomCode&&!leaving)presence()});
$("showCreate").onclick=()=>{$("createBox").classList.remove("hidden");$("joinBox").classList.add("hidden")};$("showJoin").onclick=()=>{$("joinBox").classList.remove("hidden");$("createBox").classList.add("hidden")};
async function unique(){for(let i=0;i<10;i++){let c=code();if(!(await get(ref(db,"rooms/"+c))).exists())return c}throw Error("code")}
$("create").onclick=async()=>{if(!uid)return msg("homeMsg","Firebase n'est pas prêt.","bad");if(!nick())return msg("homeMsg","Entre un pseudo.","bad");try{
// Nettoyage des anciennes rooms en "best effort" : un refus de lecture/suppression ne doit JAMAIS bloquer la création.
try{
  if(disc){await disc.cancel();disc=null}
  let all=await get(ref(db,"rooms")),oldRooms=[];
  all.forEach(c=>{let d=c.val();if(d?.host===uid)oldRooms.push(remove(c.ref))});
  await Promise.allSettled(oldRooms);
}catch(e){console.warn("Nettoyage anciennes rooms ignoré :",e?.code||e?.message||e)}
clearSession();room=null;roomCode=null;lastPrunedFor="";
roomCode=await unique();let t=now();await set(ref(db,"rooms/"+roomCode),{host:uid,status:"lobby",players:{p1:{uid,nick:nick(),lives:3,online:true,lastSeen:t}},createdAt:t,lastActivity:t,deleteAfter:t+TTL});subscribe(roomCode)}catch(e){console.error("Création Firebase :",e);msg("homeMsg","Création impossible — "+(e?.code||e?.message||"erreur inconnue"),"bad")}};
$("join").onclick=async()=>{let c=$("joinCode").value.trim().toUpperCase();if(!uid||!nick())return msg("homeMsg","Entre un pseudo.","bad");await cleanup();let r=ref(db,"rooms/"+c),s=await get(r);if(!s.exists())return msg("homeMsg","Room introuvable ou expirée.","bad");let d=s.val(),me=d.players?.p1?.uid===uid?"p1":d.players?.p2?.uid===uid?"p2":null;if(["closed","abandoned"].includes(d.status)&&!me)return msg("homeMsg","Room fermée.","bad");if(!me&&d.players?.p2?.uid)return msg("homeMsg","Room complète.","bad");let k=me||"p2";await update(r,{[`players/${k}/uid`]:uid,[`players/${k}/nick`]:nick(),[`players/${k}/online`]:true,[`players/${k}/lastSeen`]:now(),lastActivity:now(),deleteAfter:now()+TTL});subscribe(c)};
async function presence(){if(leaving)return;let me=slot(),c=roomCode;if(!me||!c)return;presenceTask=(async()=>{try{if(leaving||roomCode!==c)return;if(disc){await disc.cancel();disc=null}if(leaving||roomCode!==c)return;let p=ref(db,`rooms/${c}/players/${me}`),d=onDisconnect(p);disc=d;await d.update({online:false,lastSeen:serverTimestamp()});if(leaving||roomCode!==c){try{await d.cancel()}catch{}if(disc===d)disc=null;return}await update(p,{online:true,lastSeen:now()})}catch{}})();return presenceTask}
function subscribe(c){leaving=false;if(unsub)unsub();roomCode=c;saveSession(c);let presenceStarted=false;unsub=onValue(ref(db,"rooms/"+c),async s=>{if(!s.exists()){try{if(disc){await disc.cancel();disc=null}}catch{}clearSession();room=null;roomCode=null;clearInterval(tick);screen("home");return msg("homeMsg","La room a été fermée ou a expiré.","bad")}room=s.val();saveSession(c);if(!leaving&&!presenceStarted){presenceStarted=true;await presence()}if(!leaving)pruneHostedRooms(c);render()})}
function render(){if(!slot())return screen("home");let me=slot(),host=room.host===uid,p1=room.players?.p1,p2=room.players?.p2;$('roomCode').textContent=roomCode;$('lp1').textContent=p1?.nick||'—';$('lp2').textContent=p2?.nick||'En attente…';$('ready1').textContent=p1?.ready?'✓ Prêt':'Pas prêt';$('ready2').textContent=p2?.ready?'✓ Prêt':'Pas prêt';$('readyBtn').textContent=room.players?.[me]?.ready?'Annuler prêt':'Je suis prêt';$('readyBtn').classList.toggle('hidden',room.status!=='lobby');$('settings').textContent='3 ❤️ par joueur • chrono 60 s, −5 s tous les 10 mots (minimum 15 s)';let can=room.status==='lobby'&&host&&p2?.uid&&p1?.ready&&p2?.ready;$('startGame').classList.toggle('hidden',!can);$('lobbyMsg').textContent=!p2?.uid?'En attente du deuxième joueur…':(!p1?.ready||!p2?.ready?'Les deux joueurs doivent être prêts.':host?'Tout le monde est prêt. Tu peux lancer !':'Prêt ! En attente du créateur.');if(room.status==='lobby'){screen('lobby');return}if(['voting','opening','playing','roundEnd','finished','abandoned'].includes(room.status)){screen('game');game();return}screen('lobby')}
$('readyBtn').onclick=async()=>{let me=slot();if(!me||room?.status!=='lobby')return;await update(ref(db,`rooms/${roomCode}`),{[`players/${me}/ready`]:!room.players?.[me]?.ready,lastActivity:now()})};
$('startGame').onclick=async()=>{if(room?.status!=='lobby'||room.host!==uid||!room.players?.p1?.ready||!room.players?.p2?.ready)return;let a=starts();await runTransaction(ref(db,'rooms/'+roomCode),d=>{if(!d||d.status!=='lobby'||d.host!==uid||!d.players?.p1?.ready||!d.players?.p2?.ready)return;d.players.p1.lives=d.players.p2.lives=3;d.status='voting';d.game={round:1,choices:{0:a[0],1:a[1],2:a[2]},votes:{},history:{},seq:0,totalWords:0,message:'',voteStartedAt:now()};d.lastActivity=now();d.deleteAfter=now()+TTL;return d})};
function game(){let g=room.game||{},p1=room.players.p1||{},p2=room.players.p2||{},me=slot();$('gn1').textContent=p1.nick;$('gn2').textContent=p2.nick;$('gs1').textContent='❤️'.repeat(Math.max(0,p1.lives??3))||'💀';$('gs2').textContent='❤️'.repeat(Math.max(0,p2.lives??3))||'💀';$('gp1').classList.toggle('active',g.turn==='p1'||room.status==='opening');$('gp2').classList.toggle('active',g.turn==='p2'||room.status==='opening');let hh=hist(g),prev='';$('history').innerHTML=hh.map(x=>{let z=`<span class="pill">${marked(prev,x.word)}</span>`;prev=x.word;return z}).join('');$('choiceBox').classList.toggle('hidden',room.status!=='voting');$('form').classList.toggle('hidden',!['opening','playing'].includes(room.status));$('nextRound').classList.toggle('hidden',room.status!=='roundEnd');$('solutions').classList.toggle('hidden',!['roundEnd','finished'].includes(room.status)||!(g.solutions||[]).length);$('solutions').innerHTML=(g.solutions||[]).map(w=>`<span class="pill" style="font-weight:850;color:var(--ok)">${marked(g.current,w)}</span>`).join('');$('endActions').classList.toggle('hidden',!['finished','abandoned'].includes(room.status));clearInterval(tick);
if(room.status==='voting'){let v=g.votes||{},mine=v[me],voteStart=g.voteStartedAt||now();$('current').textContent='VOTE';$('turn').textContent='Les deux joueurs votent';let drawVote=()=>{let left=Math.max(0,15000-(now()-voteStart));$('timer').textContent=Math.ceil(left/1000);$('malus').textContent='';$('gaugeText').textContent='';$('gaugeFill').style.width='0%';$('timer').classList.toggle('danger',left<=5000);if(left<=0){clearInterval(tick);resolveVoteTimeout()}};drawVote();tick=setInterval(drawVote,100);$('choiceTitle').textContent=mine?`Ton vote : ${mine.toUpperCase()}`:'Vote pour un mot';$('voteInfo').textContent=`${Object.keys(v).length}/2 votes reçus`;$('choices').innerHTML=Object.values(g.choices||{}).map(w=>{let who=[];if(v.p1===w)who.push(p1.nick);if(v.p2===w)who.push(p2.nick);return `<div style="flex:1;text-align:center"><button class="${mine===w?'':'secondary'} choice" data-w="${w}">${w.toUpperCase()}</button><div class="small" style="min-height:20px;margin-top:4px">${who.length?who.join(' + '):'—'}</div></div>`}).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>vote(b.dataset.w));if(v.p1&&v.p2)resolveVote();return}
$('current').textContent=(g.current||'').toUpperCase();if(room.status==='roundEnd'){$('timer').textContent='—';$('turn').textContent=g.message||'Manche terminée';let rr=g.roundReady||{};$('nextRound').textContent=rr[me]?'✓ PRÊT — EN ATTENTE':"JE SUIS PRÊT";$('nextRound').disabled=!!rr[me];$('gameMsg').textContent=`Prêts pour la suite : ${Object.keys(rr).length}/2`;return}if(room.status==='finished'){let w=(p1.lives??3)>0?p1.nick:p2.nick,rv=g.replayVotes||{};$('timer').textContent='🏆';$('malus').textContent='';$('gaugeText').textContent='';$('gaugeFill').style.width='0%';$('turn').textContent=`${w} remporte la partie !`;$('replay').textContent=rv[me]?'✓ REVANCHE — EN ATTENTE':`Rejouer (${Object.keys(rv).length}/2)`;$('replay').disabled=!!rv[me];return}if(room.status==='abandoned'){$('timer').textContent='—';$('turn').textContent=g.message||'Partie terminée';return}
let opening=room.status==='opening',mine=opening||me===g.turn;$('answer').disabled=!mine;$('validate').disabled=!mine;if(mine)setTimeout(()=>{$('answer').focus()},0);$('turn').textContent=opening?'Ouverture : les deux joueurs peuvent jouer':`Tour de ${room.players[g.turn].nick}`;let draw=()=>{let gg=room.game,ti=timerInfo(gg),left=Math.max(0,ti.limit*1000-(now()-(gg.turnStartedAt||now())));$('timer').textContent=Math.ceil(left/1000);$('malus').textContent=ti.malus?`(-${ti.malus}s)`:'';$('gaugeText').textContent=ti.limit<=15?'Chrono minimum atteint : 15 s':`−5 s dans ${ti.toNext} mot${ti.toNext>1?'s':''}`;$('gaugeFill').style.width=ti.progress+'%';$('timer').classList.toggle('danger',left<=5000);let op=other(me),po=room.players[op];$('gameMsg').textContent=po?.online===false?`${po.nick} est déconnecté — 90 s pour revenir.`:(opening?'Premier mot valide lance l’alternance. Si personne ne trouve : nouveau vote.':'');if(left<=0){let k=gg.round+':'+room.status+':'+gg.turnStartedAt;if(k!==lastTimeout){lastTimeout=k;if(room.status==='opening')revote();else if(me===gg.turn)endRound(other(gg.turn),`${room.players[gg.turn].nick} n'a pas répondu à temps.`)}}if(po?.online===false&&po.lastSeen&&now()-po.lastSeen>=GRACE)abandon(op)};draw();tick=setInterval(draw,250)}
async function vote(w){let me=slot();if(room?.status!=='voting'||!Object.values(room.game.choices||{}).includes(w))return;await update(ref(db,`rooms/${roomCode}/game/votes`),{[me]:w})}
async function resolveVote(){await runTransaction(ref(db,'rooms/'+roomCode),d=>{if(!d||d.status!=='voting'||!d.game?.votes?.p1||!d.game?.votes?.p2)return;let a=d.game.votes.p1,b=d.game.votes.p2,w=a===b?a:(Math.random()<.5?a:b);d.status='opening';d.game.current=w;d.game.history={0:{seq:0,word:w,by:'start',at:now()}};d.game.seq=0;d.game.turn=null;d.game.turnStartedAt=now();delete d.game.votes;delete d.game.choices;delete d.game.voteStartedAt;return d})}
async function resolveVoteTimeout(){await runTransaction(ref(db,'rooms/'+roomCode),d=>{if(!d||d.status!=='voting'||now()-(d.game?.voteStartedAt||now())<15000)return;let v=d.game.votes||{},choices=Object.values(d.game.choices||{}),a=v.p1,b=v.p2,w;if(a&&b)w=a===b?a:(Math.random()<.5?a:b);else if(a||b)w=a||b;else w=choices[Math.random()*choices.length|0];if(!w)return;d.status='opening';d.game.current=w;d.game.history={0:{seq:0,word:w,by:'start',at:now()}};d.game.seq=0;d.game.turn=null;d.game.turnStartedAt=now();delete d.game.votes;delete d.game.choices;delete d.game.voteStartedAt;d.lastActivity=now();return d})}
async function revote(){let a=starts();await runTransaction(ref(db,'rooms/'+roomCode),d=>{if(!d||d.status!=='opening')return;d.status='voting';d.game.choices={0:a[0],1:a[1],2:a[2]};d.game.votes={};d.game.history={};d.game.seq=0;d.game.voteStartedAt=now();delete d.game.current;delete d.game.turn;delete d.game.turnStartedAt;return d})}
async function endRound(win,text){let sols=possible(room?.game?.current,3);await runTransaction(ref(db,"rooms/"+roomCode),d=>{if(!d||d.status!=="playing")return;let loser=other(win);d.players[loser].lives=Math.max(0,(d.players[loser].lives??3)-1);d.status=d.players[loser].lives<=0?"finished":"roundEnd";d.game.message=d.status==="finished"?`${d.players[win].nick} remporte la partie !`:text+` ${d.players[loser].nick} perd un ❤️.`;d.game.solutions=sols;d.game.roundReady={};d.game.roundEndedAt=now();d.lastActivity=now();d.deleteAfter=now()+(d.status==="finished"?CLOSED:TTL);return d})}
$('nextRound').onclick=async()=>{if(room?.status!=='roundEnd')return;let me=slot();await runTransaction(ref(db,'rooms/'+roomCode),d=>{if(!d||d.status!=='roundEnd')return;d.game.roundReady=d.game.roundReady||{};d.game.roundReady[me]=true;if(d.game.roundReady.p1&&d.game.roundReady.p2){let a=starts(),round=(d.game.round||1)+1;if(a.length<3)return;d.status='voting';d.game={round,choices:{0:a[0],1:a[1],2:a[2]},votes:{},history:{},seq:0,totalWords:0,message:'',voteStartedAt:now()};d.deleteAfter=now()+TTL}return d})};
async function abandon(op){let c=roomCode;if(!c)return;await runTransaction(ref(db,"rooms/"+c),d=>{if(!d||d.players?.[op]?.online!==false||now()-(d.players[op].lastSeen||now())<GRACE)return;return null})}
$("form").onsubmit=async e=>{e.preventDefault();let me=slot(),g=room?.game,w=norm($("answer").value),state=room?.status;if(!w||!["opening","playing"].includes(state)||(state==="playing"&&me!==g.turn))return;if(hist(g).some(x=>key(x.word)===key(w)))return msg("gameMsg","Mot déjà joué.","bad");if(!mutation(g.current,w))return msg("gameMsg","Ajoute, retire ou remplace exactement une lettre.","bad");if(!dictReady||!WORDS.has(key(w)))return msg("gameMsg",dictReady?"Mot absent du dictionnaire.":"Dictionnaire non chargé.","bad");w=WORD_FORM.get(key(w))||w;let cur=g.current,seq=g.seq||0,res=await runTransaction(ref(db,"rooms/"+roomCode),d=>{if(!d||!["opening","playing"].includes(d.status)||d.game.current!==cur||(d.game.seq||0)!==seq||(d.status==="playing"&&d.game.turn!==me)||hist(d.game).some(x=>key(x.word)===key(w)))return;let n=seq+1;d.game.current=w;d.game.seq=n;d.game.totalWords=(d.game.totalWords||0)+1;d.game.history=d.game.history||{};d.game.history[n]={seq:n,word:w,by:me,at:now()};d.status="playing";d.game.turn=other(me);d.game.turnStartedAt=now();d.game.message="";d.lastActivity=now();d.deleteAfter=now()+TTL;return d});if(res.committed)$("answer").value=""};
async function leave(){let c=roomCode,me=slot();if(!c||!me)return screen("home");if(!confirm("Êtes-vous sûr(e) de vouloir quitter ?"))return;let r=ref(db,"rooms/"+c);leaving=true;if(unsub){unsub();unsub=null}clearSession();roomCode=null;try{await presenceTask}catch{}try{if(disc){await disc.cancel();disc=null}await remove(r)}catch(e){leaving=false;roomCode=c;subscribe(c);return msg(room?.status==="lobby"?"lobbyMsg":"gameMsg","Impossible de supprimer la salle : "+(e?.code||e?.message||"erreur Firebase"),"bad")}room=null;clearInterval(tick);screen("home");msg("homeMsg","Tu as quitté la salle.","ok")}
$("leaveLobby").onclick=leave;$("quitGame").onclick=leave;$("replay").onclick=async()=>{if(room?.status!=="finished")return;let me=slot();await runTransaction(ref(db,"rooms/"+roomCode),d=>{if(!d||d.status!=="finished"||!d.players?.p2)return;d.game=d.game||{};d.game.replayVotes=d.game.replayVotes||{};d.game.replayVotes[me]=true;if(d.game.replayVotes.p1&&d.game.replayVotes.p2){let a=starts();if(a.length<3)return;d.players.p1.lives=d.players.p2.lives=3;d.status="voting";d.game={round:1,choices:{0:a[0],1:a[1],2:a[2]},votes:{},history:{},seq:0,totalWords:0,message:"",voteStartedAt:now()};d.lastActivity=now();d.deleteAfter=now()+TTL}return d})};</script></body></html>
